name: ScoutIQ CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        working-directory: ./scoutiq
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python Scripts Compile
        working-directory: ./scoutiq
        run: |
          python -m py_compile src/process_video.py
          python -m py_compile src/player_labeling.py
          python -m py_compile src/track_players.py

      - name: Verify Dashboard Compiles
        working-directory: ./scoutiq
        run: |
          python -m py_compile app/dashboard.py

      - name: Success
        run: echo "ScoutIQ CI passed!"