name: ScoutIQ CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # GitHub runners fill up when pip pulls CUDA torch (~2GB+ of nvidia-* wheels).
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          df -h

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            scoutiq/requirements-ci.txt

      - name: Upgrade Pip
        run: |
          python -m pip install --upgrade pip

      - name: Install CPU PyTorch + CI dependencies
        working-directory: ./scoutiq
        run: |
          # CPU wheels only — never resolve the CUDA toolkit on the runner.
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt

      - name: Verify All Python Files Compile
        working-directory: ./scoutiq
        run: |
          python -m compileall -q src app

      - name: Display Success Message
        run: |
          echo "ScoutIQ CI completed successfully!"
