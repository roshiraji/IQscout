# Train lightweight yolo11n-seg → outputs/training_loop/best_player_seg.pt
# Run from scoutiq/:  python -m src.showcase train --config configs/showcase_train.yaml

dataset:
  data_yaml: data/datasets/nba_player_seg/data.yaml

output:
  runs_root: outputs/training_loop

training:
  model: yolo11n-seg.pt
  epochs: 80
  max_rounds: 3
  imgsz: 960
  # Single-GPU batch (device 0). Windows DDP is flaky here; GPU 1 is used for
  # parallel autolabel during training instead.
  batch: 8
  workers: 2
  device: 0

targets:
  min_box_map50: 0.45
  min_mask_map50: 0.35
