# Live user-facing player tracking (React dashboard + FastAPI).
#
# Online path: upload → best_player_seg.pt → ByteTrack → tracklet stitch
# (stable person_group_id) → select → focused H.264. NO GDINO/SAM2.

# Trained showcase weights (relative to scoutiq/).
# v2 trained on all three Fever games — Sparks 7/8, Mercury 7/9, Aces 7/12.
# Previous production weights: outputs/training_loop/best_player_seg.pt
weights: outputs/training_loop_v2/best_player_seg_v2.pt

# Detection thresholds.
conf: 0.25
iou: 0.70

# Inference device: "0" for first CUDA GPU, "cpu", or "auto".
device: "cpu"

# Exclusion JSONs (court ROI / scorebug). Soft-fails to defaults if missing.
exclusions_dir: data/exclusions

# Overlay + tracking behaviour.
mask_overlay: true
mask_smooth_alpha: 0.35
min_track_frames: 3

# Full clip by default; set a number only for local smoke tests.
max_frames: null

# Online tracker (isolated per job). bytetrack is the default; botsort is
# reserved for a future optional path. Continuity is primarily improved by
# stitching after the full pass.
tracker:
  tracker_type: bytetrack
  track_activation_threshold: 0.25
  lost_track_buffer: 60
  minimum_matching_threshold: 0.75

# Post-pass tracklet stitching → stable person_group_id.
stitch:
  enabled: true
  max_gap_seconds: 1.5
  max_center_distance_ratio: 0.18   # fraction of frame diagonal
  color_weight: 0.65
  appearance_weight: 0.35          # used when OSNet/torchreid is available
  spatial_weight: 0.25
  min_merge_score: 0.55
  min_group_frames: 8
  keyframe_samples: 3
  use_osnet: true                  # soft-fail to color-only if unavailable

# Jersey-color team buckets for snapshot selection + later metrics.
# Clusters visible players into ~2 teams (e.g. red vs blue) on a dense frame.
jersey_teams:
  enabled: true
  top_frame_fraction: 0.92
  max_candidate_frames: 12

# Optional named identity (Resolve jersey identities). Searches each person's
# full track for cheap OCR opportunities, then OCR's only top-N diverse frames.
identity:
  jersey_ocr:
    max_candidates_per_person: 48
    min_spacing_frames: 3
    min_agreeing_reads: 2
    min_consistency: 0.60
    min_read_confidence: 0.50
    min_bbox_height: 100
    min_bbox_width: 45
    min_crop_height: 70
    min_crop_width: 35
    min_sharpness: 25
    min_contrast: 18

# Full-clip quality gates (detector vs tracker continuity).
quality:
  min_frame_coverage: 0.90
  min_mean_detection_confidence: 0.50
  max_short_track_ratio: 0.35
  max_track_gap_frames: 30

# Dedicated basketball detector (separate from player seg weights).
# Soft-fails to HSV orange proposals when weights are missing.
ball:
  enabled: true
  weights: outputs/training_loop_ball/best_ball_det.pt
  conf: 0.25
  device: "cpu"          # use "0" when CUDA available and ball train done
  every_n_frames: 1      # raise to 2–3 on CPU if Analyze is too slow
  hsv_fallback: true
  track:
    iou_threshold: 0.15
    max_missed: 12
    interpolate:         # WS1: fill short ball gaps between real detections
      enabled: true
      max_gap: 5
      min_conf: 0.2
  hoop:                  # WS3: attacking-direction anchor (optional)
    enabled: false       # set true once best_hoop_det.pt is trained
    weights: outputs/training_loop_hoop/best_hoop_det.pt
    conf: 0.30
    every_n_frames: 15
  possession:
    max_dist_norm: 0.12
    min_held_fraction: 0.12
    min_confidence: 0.45
    min_window_frames: 8   # WS4: possession windows
    margin: 0.12           # WS2: winning team must beat runner-up by this
    fusion_weights:        # WS2: signal weights (sum ~1.0)
      possession: 0.55
      direction: 0.25
      spread: 0.08
      continuity: 0.12

# Focused-player isolate preview (background job after Confirm).
# mode: hybrid   = temporal neighbor fill, then LaMa on leftovers (best default)
#       ai       = LaMa only on full erase mask
#       temporal = neighbor fill + OpenCV inpaint (CPU-friendly)
isolate:
  mode: hybrid             # hybrid | ai | temporal — falls back to temporal if GPU/pkg missing
  ai_backend: lama         # lama (propainter reserved)
  erase_dilate: 13         # stronger non-selected fringe removal
  keep_dilate: 7           # protect selected player pixels under overlap
  bbox_expand: 0.12        # expand erase bbox to catch shoes/arms
  fallback_to_temporal: true
  lama_leftover_min_pixels: 64
  min_temporal_samples: 2  # ignore weak 1-neighbor fills (they look smeary)
  lama_full_erase: true    # LaMa repaints whole hole — kills stuck blur
  hard_composite: true     # no soft-blend of removed players back in
  # Fast path on local GPU (RTX 3070 8GB): crop erase region + downscale for LaMa.
  ai_working_side: 768     # set null or "full" for max quality / slower
  crop_pad: 48
  orb_features: 700        # temporal align cost on CPU
  # ai_max_side: 1024      # optional hard tile cap; omit = VRAM probe + cache
